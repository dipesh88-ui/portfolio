          const sections = ['home', 'projects', 'skills', 'about', 'education', 'contact'];

          for (const s of sections) {

              const h = el.offsetHeight;
              if (scrollPos >= top && scrollPos < top + h) {
                setActiveSection(s);
                break;
              }

          }

        return () => window.removeEventListener('scroll', handleScroll);

                            {item.icon}
                          </div>
                          <div className="flex-1">
                            <div className="flex items-center justify-between gap-2 mb-1">
                              <span className="text-[11px] font-semibold text-violet-400 uppercase tracking-wider">{item.category}</span>
                              <span className="text-xs font-mono text-gray-300 bg-white/5 px-2 py-0.5 rounded">{item.badge}</span>
                            </div>
                            <h3 className="text-base font-bold text-white leading-snug">{item.title}</h3>
                            <p className="text-xs text-gray-400 mt-1.5 leading-relaxed">{item.desc}</p>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* 7. CONTACT SECTION */}
            <section id="contact" className="py-20 sm:py-28 relative scroll-mt-16 bg-[#080c16]/50">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative">
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-12">
                  {/* Left Column */}
                  <div className="lg:col-span-5 space-y-6">
                    <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20 text-blue-400 text-xs font-semibold uppercase tracking-wider">
                      <span>📫</span>
                      Get In Touch
                    </div>
                    <h2 className="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">
                      Let's Build Something Meaningful.
                    </h2>
                    <p className="text-base text-gray-300 leading-relaxed">
                      Have an opportunity, project idea, or collaboration in mind? Let's connect. I am actively seeking roles in Software Development and AI/ML.
                    </p>

                    <div className="space-y-3 pt-2">
                      {/* Email */}
                      <div className="p-4 rounded-xl bg-[#0b101f] border border-white/5 hover:border-blue-500/30 transition-all flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-lg bg-blue-500/10 text-blue-400 flex items-center justify-center text-lg">
                            ✉️
                          </div>
                          <div>
                            <span className="text-[11px] text-gray-400 block">Direct Email</span>
                            <a href={`mailto:${personal.email}`} className="text-sm font-semibold text-white hover:text-blue-300 transition-colors">
                              {personal.email}
                            </a>
                          </div>
                        </div>
                        <button onClick={copyToClipboard} className="px-2.5 py-1 text-xs rounded bg-white/5 hover:bg-white/10 text-gray-300 border border-white/10 transition-colors">
                          {copiedEmail ? 'Copied ✓' : 'Copy'}
                        </button>
                      </div>

                      {/* Phone */}
                      <div className="p-4 rounded-xl bg-[#0b101f] border border-white/5 hover:border-emerald-500/30 transition-all flex items-center justify-between">
                        <div className="flex items-center gap-3">
                          <div className="w-10 h-10 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-lg">
                            📞
                          </div>
                          <div>
                            <span className="text-[11px] text-gray-400 block">Phone</span>
                            <a href={`tel:${personal.phone}`} className="text-sm font-semibold text-white hover:text-emerald-300 transition-colors">
                              {personal.phone}
                            </a>
                          </div>
                        </div>
                        <a href={`tel:${personal.phone}`} className="px-2.5 py-1 text-xs rounded bg-white/5 hover:bg-white/10 text-gray-300 border border-white/10 transition-colors">
                          Call
                        </a>
                      </div>

                      {/* Location */}
                      <div className="p-4 rounded-xl bg-[#0b101f] border border-white/5 flex items-center gap-3">
                        <div className="w-10 h-10 rounded-lg bg-indigo-500/10 text-indigo-400 flex items-center justify-center text-lg">
                          📍
                        </div>
                        <div>
                          <span className="text-[11px] text-gray-400 block">Location</span>
                          <span className="text-sm font-semibold text-white">{personal.location}</span>
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Right Column: Direct Mail Composition */}
                  <div className="lg:col-span-7">
                    <form onSubmit={handleContactSubmit} noValidate className="p-6 sm:p-8 rounded-2xl bg-[#0b101f] border border-white/10 shadow-2xl space-y-4">
                      <h3 className="text-lg font-bold text-white mb-1">Send a Direct Message</h3>
                      <p className="text-xs text-gray-400 mb-4">Composes a formatted inquiry directly in your email client.</p>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label className="block text-xs font-semibold text-gray-300 mb-1">Your Name *</label>
                          <input
                            type="text"
                            value={contactForm.name}
                            onChange={(e) => setContactForm({ ...contactForm, name: e.target.value })}
                            placeholder="Alex Morgan"
                            className={`w-full px-3.5 py-2.5 rounded-lg bg-[#070b14] border text-sm text-white placeholder-gray-500 focus:outline-none ${
                              formErrors.name ? 'border-red-500' : 'border-white/10 focus:border-blue-500'
                            }`}
                          />
                          {formErrors.name && <p className="text-[11px] text-red-400 mt-1">{formErrors.name}</p>}
                        </div>

                        <div>
                          <label className="block text-xs font-semibold text-gray-300 mb-1">Your Email *</label>
                          <input
                            type="email"
                            value={contactForm.email}
                            onChange={(e) => setContactForm({ ...contactForm, email: e.target.value })}
                            placeholder="alex@company.com"
                            className={`w-full px-3.5 py-2.5 rounded-lg bg-[#070b14] border text-sm text-white placeholder-gray-500 focus:outline-none ${
                              formErrors.email ? 'border-red-500' : 'border-white/10 focus:border-blue-500'
                            }`}
                          />
                          {formErrors.email && <p className="text-[11px] text-red-400 mt-1">{formErrors.email}</p>}
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-gray-300 mb-1">Subject *</label>
                        <input
                          type="text"
                          value={contactForm.subject}
                          onChange={(e) => setContactForm({ ...contactForm, subject: e.target.value })}
                          placeholder="SDE Opportunity / AI Project"
                          className={`w-full px-3.5 py-2.5 rounded-lg bg-[#070b14] border text-sm text-white placeholder-gray-500 focus:outline-none ${
                            formErrors.subject ? 'border-red-500' : 'border-white/10 focus:border-blue-500'
                          }`}
                        />
                        {formErrors.subject && <p className="text-[11px] text-red-400 mt-1">{formErrors.subject}</p>}
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-gray-300 mb-1">Message *</label>
                        <textarea
                          rows={4}
                          value={contactForm.message}
                          onChange={(e) => setContactForm({ ...contactForm, message: e.target.value })}
                          placeholder="Tell me about your team or project requirements..."
                          className={`w-full px-3.5 py-2.5 rounded-lg bg-[#070b14] border text-sm text-white placeholder-gray-500 focus:outline-none ${
                            formErrors.message ? 'border-red-500' : 'border-white/10 focus:border-blue-500'
                          }`}
                        />
                        {formErrors.message && <p className="text-[11px] text-red-400 mt-1">{formErrors.message}</p>}
                      </div>

                      <div className="flex flex-col sm:flex-row gap-3 pt-1">
                        <button
                          type="submit"
                          disabled={submitting}
                          className="flex-1 inline-flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-gradient-to-r from-blue-600 via-indigo-600 to-violet-600 hover:from-blue-500 hover:to-violet-500 text-white font-semibold text-sm shadow-lg shadow-blue-600/25 active:scale-[0.99] transition-all disabled:opacity-50"
                        >
                          {submitting ? 'Opening Mail Client...' : 'Send via Email Client ↵'}
                        </button>
                        <button
                          type="button"
                          onClick={copyMessageToClipboard}
                          className="px-4 py-3 rounded-xl bg-white/5 hover:bg-white/10 text-gray-300 hover:text-white font-medium text-xs border border-white/10 transition-colors"
                        >
                          {copiedMessage ? 'Message Copied ✓' : 'Copy Message'}
                        </button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </section>
          </main>

          {/* FOOTER */}
          <footer className="border-t border-white/10 bg-[#060911] text-gray-400 py-12 text-xs">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex flex-col md:flex-row items-center justify-between gap-6 pb-8 border-b border-white/5">
                <div className="flex flex-col items-center md:items-start space-y-1">
                  <div className="flex items-center gap-2">
                    <div className="w-7 h-7 rounded-lg bg-gradient-to-tr from-blue-600 to-violet-600 flex items-center justify-center text-white font-bold text-xs">
                      DK
                    </div>
                    <span className="text-sm font-bold text-white tracking-tight">{personal.name}</span>
                  </div>
                  <p className="text-gray-400 text-xs">
                    Software Developer | AI/ML Engineer · B.Tech CSE (2023–Present)
                  </p>
                </div>

                <div className="flex flex-wrap justify-center gap-4 text-xs">
                  {['home', 'projects', 'skills', 'about', 'education', 'contact'].map((s) => (
                    <button key={s} onClick={() => scrollTo(s)} className="hover:text-blue-400 capitalize transition-colors">
                      {s}
                    </button>
                  ))}
                </div>

                <button
                  onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
                  className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white/5 hover:bg-white/10 text-gray-300 hover:text-white border border-white/10 transition-colors"
                >
                  <span>Back to top</span>
                  <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
                    <polyline points="18 15 12 9 6 15" />
                  </svg>
                </button>
              </div>

              <div className="flex flex-col sm:flex-row items-center justify-between gap-4 pt-6 text-[11px] text-gray-500">
                <div>© {new Date().getFullYear()} {personal.name}. Verified engineering portfolio & project rights reserved.</div>
                <div className="flex items-center gap-4">
                  <a href={`mailto:${personal.email}`} className="hover:text-gray-300">{personal.email}</a>
                  <span>·</span>
                  <span>{personal.location}</span>
                </div>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // Mount the Application
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
